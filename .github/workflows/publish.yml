name: Docker Hub

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.compare.outputs.should_publish }}
    steps:
      - name: Get latest npm version
        id: npm
        run: |
          version=$(curl -s https://registry.npmjs.org/@anthropic-ai/claude-code/latest | jq -r .version)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check if Docker Hub tag exists
        id: compare
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://hub.docker.com/v2/repositories/lordjabez/claude-code-sharepoint/tags/${{ steps.npm.outputs.version }})
          if [ "$status" = "200" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lordjabez/claude-code-sharepoint:local

      - name: Extract Claude Code version
        id: version
        run: |
          version=$(docker run --rm --entrypoint claude lordjabez/claude-code-sharepoint:local --version | grep -oP '\d+\.\d+\.\d+')
          echo "tag=${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lordjabez/claude-code-sharepoint:latest
            lordjabez/claude-code-sharepoint:${{ steps.version.outputs.tag }}
